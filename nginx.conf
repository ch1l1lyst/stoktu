server {
    listen 80;
    server_name stoktu-prodid.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name stoktu-prodid.duckdns.org;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Para el frontend React: manejo de rutas SPA
    location / {
        try_files $uri /index.html;
    }

    # Procesar peticiones API con PHP-FPM
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pasar archivos .php al backend (FastCGI)
    location ~ \.php$ {
        # Incluir parámetros fastcgi estándar
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Opcional: ajustar timeouts si es necesario
    }

    # Negar acceso a archivos ocultos
    location ~ /\. {
        deny all;
    }
}