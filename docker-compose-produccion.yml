version: "3.8"

services:
  backend:
    image: ch1l1lyst/stoktu-backend:latest
    container_name: stoktu-backend
    restart: unless-stopped
    expose:
      - "9000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://stoktu-prodid.duckdns.org
      - DB_CONNECTION=mysql
      - DB_HOST=10.0.1.94
      - DB_PORT=3306
      - DB_DATABASE=stoktudb
      - DB_USERNAME=root
      - DB_PASSWORD=Mefisto#2002
    volumes:
      - backend-storage:/var/www/html/storage
    networks:
      - app-network

  frontend:
    image: ch1l1lyst/stoktu-frontend:latest
    container_name: stoktu-frontend
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - VITE_API_URL=https://stoktu-prodid.duckdns.org/api
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: stoktu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

volumes:
  backend-storage:

networks:
  app-network:
    driver: bridge
