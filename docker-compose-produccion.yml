version: "3.8"

networks:
  app-network:
    driver: bridge

services:
  nginx:
    image: nginx:alpine
    container_name: stoktu-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: stoktu-backend
    # Exponer puerto 9000 (solo interno)
    expose:
      - "9000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://stoktu-prodid.duckdns.org
      # Otras variables de entorno (DB, etc.)
    volumes:
      - ./backend:/var/www/html
      # Opcional: no montar bootstrap/cache para evitar que el caché se sobrescriba
    networks:
      - app-network
